<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEC1_ESCENA1</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>

    <a-scene>
        <a-camera>
            <a-cursor color="#66ffff"></a-cursor>
        </a-camera>


        <a-assets>
            <img id="sky" src="image.jpg">
            <img id="pez" src="pez.jpg">
            <img id="vaca" src="vaca.jpg">
            <img id="piedra" src="piedra.jpg">

        </a-assets>

        <a-sky id="image-360" radius="150" src="#sky" segments-width="128" segments-height="64"></a-sky>

        <a-dodecahedron position="18 -5 -3" radius="1.3" material="src: #piedra" rotation="20 30 0">
        </a-dodecahedron>

        <a-dodecahedron position="18.2 -4 -3.6" radius="0.8" material="src: #piedra" rotation="45 10 20">
        </a-dodecahedron>

        <a-box position="-3 3 -6" radius="1" material="src: #vaca" rotation="45 10 20" animation="property: rotation;
               to: 45 -370 20;
             dur: 5000;
             easing: linear;
             loop: true">
        </a-box>
        <a-box position="3 3 -6" radius="1" material="src: #pez" rotation="45 10 20" animation="property: rotation;
               to: 45 370 20;
             dur: 5000;
             easing: linear;
             loop: true">
        </a-box>

         <a-link href="escena2.html" title="escena 2" position="-10 1 0" rotation="0 90 20"></a-link>
    </a-scene>

</body>

</html>
